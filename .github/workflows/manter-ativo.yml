name: Manter o banco acordado

# O Supabase gratuito pausa o projeto depois de uma semana sem uso.
# Esta rotina faz uma consulta leve a cada 3 dias para ele continuar ativo.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://pziqkepgluxvdikllfwq.supabase.co/rest/v1/app_settings?select=key&limit=1' \
            -H 'apikey: sb_publishable_J0n__8-3G6Tf6rnz4Xu_7A_uLIbfKbJ')
          echo "Resposta do banco: $status"
          test "$status" = "200"
